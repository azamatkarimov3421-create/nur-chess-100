  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Rasmga 1-ga-1 aniq konteyner */
    .website-mockup-wrapper {
      position: relative;
      width: 100%;
      max-width: 682px;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      line-height: 0;
    }

    /* 1-ga-1 Asl Rasm */
    .website-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Ustiga qo'yilgan bosiladigan havolalar (Hotspots) */
    .link-hotspot {
      position: absolute;
      display: block;
      cursor: pointer;
      text-decoration: none;
    }

    /* 1. Yuqori menyu Bog'lanish tugmasi */
    .link-nav-contact {
      top: 1.1%;
      right: 3.5%;
      width: 17%;
      height: 2.4%;
      border-radius: 6px;
    }

    /* 2. Shaxs haqida -> Batafsil ma'lumot */
    .link-about-more {
      top: 44.2%;
      left: 4.5%;
      width: 20%;
      height: 2.6%;
      border-radius: 6px;
    }

    /* 3. NUR CHESS 100 sarlavhasi / linki */
    .link-chess-title {
      top: 53.8%;
      left: 4.5%;
      width: 40%;
      height: 2.8%;
    }

    /* 4. Tanishuv videosi tugmasi */
    .link-chess-video {
      top: 66.2%;
      left: 4.5%;
      width: 21%;
      height: 2.8%;
      border-radius: 6px;
    }

    /* 5. Shaxmat -> Batafsil tugmasi */
    .link-chess-more {
      top: 66.2%;
      left: 26.5%;
      width: 13%;
      height: 2.8%;
      border-radius: 6px;
    }

    /* 6. Butun 10x10 shaxmat doskasi */
    .link-chess-board {
      top: 50.2%;
      left: 46.5%;
      width: 24.5%;
      height: 16.5%;
      border-radius: 12px;
    }

    /* 7. KATTA RASMIY O'YIN PLATFORMASI BANNERI BUTUNLAY BOSILADIGAN */
    .link-main-game-banner {
      top: 72.5%;
      left: 2.6%;
      width: 94.8%;
      height: 10.5%;
      border-radius: 14px;
    }

    /* 8. Aloqa raqami 1: (90) 665-58-44 */
    .link-phone-1 {
      top: 86.8%;
      left: 4.5%;
      width: 29%;
      height: 4.8%;
      border-radius: 12px;
    }

    /* 9. Aloqa raqami 2: (93) 665-58-44 */
    .link-phone-2 {
      top: 86.8%;
      left: 35.5%;
      width: 29%;
      height: 4.8%;
      border-radius: 12px;
    }

    /* 10. Aloqa raqami 3: (90) 717-44-54 */
    .link-phone-3 {
      top: 86.8%;
      left: 66.5%;
      width: 29%;
      height: 4.8%;
      border-radius: 12px;
    }

    /* 11. Footer linklari */
    .link-footer-game {
      bottom: 1.5%;
      left: 3.5%;
      width: 25%;
      height: 3%;
    }
